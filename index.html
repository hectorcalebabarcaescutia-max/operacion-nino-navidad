<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operación Niño de la Navidad (Samaritan's Purse)</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- jsPDF & html2canvas for PDF Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- SheetJS for Excel generation -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        :root {
            --primary-red: #a81c1c;
            --metallic-red: linear-gradient(135deg, #b31414 0%, #750d0d 100%);
            --accent-green: #198754;
            --light-green-bg: #e8f5e9;
            --dark-bg: #4a0808;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--metallic-red);
            color: #333;
            min-height: 100vh;
        }

        .navbar-custom {
            background-color: var(--dark-bg);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .card-main {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            background: #ffffff;
        }

        .btn-custom-red {
            background: var(--primary-red);
            color: white;
            border: none;
            transition: all 0.2s ease;
        }
        .btn-custom-red:hover {
            background: #8e1717;
            color: white;
            transform: scale(1.02);
        }

        .btn-custom-green {
            background: var(--accent-green);
            color: white;
            border: none;
            transition: all 0.2s ease;
        }
        .btn-custom-green:hover {
            background: #146c43;
            color: white;
            transform: scale(1.02);
        }

        .carousel-item img {
            height: 220px;
            object-fit: cover;
            border-radius: 12px;
        }

        /* Estilos ajustados para zona de administración en móvil */
        .admin-action-box {
            background: var(--accent-green);
            color: white;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .admin-action-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        @media (min-width: 576px) {
            .admin-action-buttons {
                flex-direction: row;
            }
        }

        .table-responsive {
            border-radius: 10px;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <!-- Navbar Principal -->
    <nav class="navbar navbar-expand-lg navbar-custom navbar-dark py-3">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="#" onclick="showHome()">
                <img src="img/logo.png" alt="Logo" width="40" height="40" class="rounded-circle bg-white p-1" onerror="this.style.display='none'">
                <span class="fw-bold fs-5 text-white">🎁 Operación Niño de la Navidad</span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav gap-2 mt-2 mt-lg-0">
                    <li class="nav-item">
                        <button class="btn btn-custom-green w-100 text-start text-lg-center" onclick="showRegisterForm()">
                            <i class="bi bi-church-fill me-1"></i> Registrar Iglesia
                        </button>
                    </li>
                    <li class="nav-item">
                        <button class="btn btn-custom-red w-100 text-start text-lg-center" onclick="showAdminLogin()">
                            <i class="bi bi-gear-fill me-1"></i> Panel Administrador
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenedor Principal Dinámico -->
    <div class="container my-4" id="main-container">
        <!-- El contenido cambia dinámicamente mediante JS -->
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // CONFIGURACIÓN DE SUPABASE
        const SUPABASE_URL = 'https://tu-proyecto.supabase.co'; // Reemplaza con tu URL
        const SUPABASE_KEY = 'tu-clave-anon'; // Reemplaza con tu Key Anónima
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Al cargar la página
        document.addEventListener('DOMContentLoaded', () => {
            showHome();
        });

        // VISTA INICIO / CARRUSEL
        function showHome() {
            const container = document.getElementById('main-container');
            container.innerHTML = `
                <div class="row justify-content-center">
                    <div class="col-lg-10">
                        <div class="card card-main p-4 mb-4">
                            <!-- Carrusel de Imágenes -->
                            <div id="carouselExampleIndicators" class="carousel slide mb-4" data-bs-ride="carousel">
                                <div class="carousel-indicators">
                                    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active"></button>
                                    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1"></button>
                                </div>
                                <div class="carousel-indicators"></div>
                                <div class="carousel-inner">
                                    <div class="carousel-item active">
                                        <img src="img/banner1.jpg" class="d-block w-100" alt="Banner 1" onerror="this.src='https://images.unsplash.com/photo-1543589077-47d81606c1bf?auto=format&fit=crop&w=800&q=80'">
                                    </div>
                                    <div class="carousel-item">
                                        <img src="img/banner2.jpg" class="d-block w-100" alt="Banner 2" onerror="this.src='https://images.unsplash.com/photo-1512389142860-9c449e580543?auto=format&fit=crop&w=800&q=80'">
                                    </div>
                                </div>
                                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
                                    <span class="carousel-control-prev-icon"></span>
                                </button>
                                <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
                                    <span class="carousel-control-next-icon"></span>
                                </button>
                            </div>

                            <div class="text-center py-3">
                                <h2 class="fw-bold text-danger mb-3">¡Bienvenidos al Sistema de Registro!</h2>
                                <p class="text-muted">Selecciona una opción en el menú superior para registrar una nueva iglesia o acceder al panel administrativo por zona.</p>
                                <div class="d-flex justify-content-center gap-3 mt-4">
                                    <button class="btn btn-custom-green btn-lg px-4" onclick="showRegisterForm()">
                                        <i class="bi bi-church-fill me-2"></i> Registrar Iglesia
                                    </button>
                                    <button class="btn btn-custom-red btn-lg px-4" onclick="showAdminLogin()">
                                        <i class="bi bi-gear-fill me-2"></i> Administrador
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // FORMULARIO DE REGISTRO DE IGLESIA Y NIÑOS
        function showRegisterForm() {
            const container = document.getElementById('main-container');
            container.innerHTML = `
                <div class="row justify-content-center">
                    <div class="col-lg-8">
                        <div class="card card-main p-4">
                            <h3 class="fw-bold text-success mb-3"><i class="bi bi-church me-2"></i>Registro de Iglesia y Niños</h3>
                            <form id="form-iglesia">
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Zona:</label>
                                    <select class="form-select" id="reg-zona" required>
                                        <option value="1">San Andrés</option>
                                        <option value="2">Xalapa</option>
                                        <option value="3">Cd. Alemán</option>
                                        <option value="4">Veracruz Centro</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Nombre de la Iglesia:</label>
                                    <input type="text" class="form-control" id="reg-nombre-iglesia" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold"><i class="bi bi-person-badge me-1"></i> Pastor:</label>
                                    <input type="text" class="form-control" id="reg-pastor" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold"><i class="bi bi-geo-alt-fill me-1"></i> Domicilio:</label>
                                    <input type="text" class="form-control" id="reg-domicilio" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold"><i class="bi bi-telephone-fill me-1"></i> Teléfono:</label>
                                    <input type="tel" class="form-control" id="reg-telefono" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold"><i class="bi bi-map-fill me-1"></i> Municipio / Estado:</label>
                                    <input type="text" class="form-control" id="reg-municipio" required>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label fw-semibold"><i class="bi bi-calendar-event me-1"></i> Fecha de Entrega:</label>
                                    <input type="date" class="form-control" id="reg-fecha" required>
                                </div>

                                <hr class="my-4">
                                <h4 class="fw-bold text-danger mb-3"><i class="bi bi-people-fill me-2"></i>Listado de Niños Registrados</h4>
                                <div id="ninos-container">
                                    <!-- Aquí se añaden filas dinámicas de niños -->
                                </div>
                                <button type="button" class="btn btn-outline-success mb-4" onclick="agregarFilaNino()">
                                    <i class="bi bi-plus-circle me-1"></i> Agregar Otro Niño/Niña
                                </button>

                                <div class="d-grid">
                                    <button type="submit" class="btn btn-custom-green btn-lg">Guardar Registro Completo</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            `;
            agregarFilaNino(); // Agregar primera fila por defecto

            document.getElementById('form-iglesia').addEventListener('submit', async (e) => {
                e.preventDefault();
                await guardarRegistroCompleto();
            });
        }

        function agregarFilaNino(nombre='', genero='Niño', edad=5) {
            const container = document.getElementById('ninos-container');
            const div = document.createElement('div');
            div.className = 'row g-2 align-items-center mb-2 nino-row';
            div.innerHTML = `
                <div class="col-md-6">
                    <input type="text" class="form-control nino-nombre" placeholder="Nombre completo del niño/a" value="${nombre}" required>
                </div>
                <div class="col-md-3">
                    <select class="form-select nino-genero">
                        <option value="Niño" ${genero==='Niño'?'selected':''}><i class="bi bi-gender-male"></i> 👦 Niño</option>
                        <option value="Niña" ${genero==='Niña'?'selected':''}><i class="bi bi-gender-female"></i> 👧 Niña</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <input type="number" class="form-control nino-edad" placeholder="Edad" min="2" max="14" value="${edad}" required>
                </div>
                <div class="col-md-1">
                    <button type="button" class="btn btn-outline-danger w-100" onclick="this.closest('.row').remove()"><i class="bi bi-trash"></i></button>
                </div>
            `;
            container.appendChild(div);
        }

        async function guardarRegistroCompleto() {
            const zona_id = document.getElementById('reg-zona').value;
            const nombre = document.getElementById('reg-nombre-iglesia').value;
            const pastor = document.getElementById('reg-pastor').value;
            const domicilio = document.getElementById('reg-domicilio').value;
            const telefono = document.getElementById('reg-telefono').value;
            const municipio = document.getElementById('reg-municipio').value;
            const fecha_entrega = document.getElementById('reg-fecha').value;

            // 1. Guardar Iglesia
            const { data: iglData, error: iglError } = await _supabase.from('iglesias').insert([{
                zona_id, nombre, pastor, domicilio, telefono, municipio, fecha_entrega
            }]).select();

            if (iglError) {
                alert('Error al guardar iglesia: ' + iglError.message);
                return;
            }

            const iglesia_id = iglData[0].id;

            // 2. Guardar Niños
            const filas = document.querySelectorAll('.nino-row');
            let ninosArray = [];
            filas.forEach(fila => {
                ninosArray.push({
                    iglesia_id,
                    nombre_nino: fila.querySelector('.nino-nombre').value,
                    genero: fila.querySelector('.nino-genero').value,
                    edad: parseInt(fila.querySelector('.nino-edad').value)
                });
            });

            if (ninosArray.length > 0) {
                const { error: ninError } = await _supabase.from('ninos').insert(ninosArray);
                if (ninError) {
                    alert('Iglesia guardada, pero hubo error al guardar niños: ' + ninError.message);
                    return;
                }
            }

            alert('¡Registro guardado con éxito!');
            showHome();
        }

        // LOGIN DE ADMINISTRADOR
        function showAdminLogin() {
            const container = document.getElementById('main-container');
            container.innerHTML = `
                <div class="row justify-content-center">
                    <div class="col-md-6">
                        <div class="card card-main p-4">
                            <h3 class="fw-bold text-danger mb-3"><i class="bi bi-gear-fill me-2"></i>Acceso Administrativo</h3>
                            <p class="text-muted">Selecciona tu zona e introduce tu contraseña de administrador.</p>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Zona:</label>
                                <select class="form-select" id="admin-zona">
                                    <option value="1">San Andrés</option>
                                    <option value="2">Xalapa</option>
                                    <option value="3">Cd. Alemán</option>
                                    <option value="4">Veracruz Centro</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Contraseña:</label>
                                <input type="password" class="form-control" id="admin-pass" placeholder="••••••••••••">
                            </div>
                            <button class="btn btn-custom-red w-100 py-2" onclick="validarAdmin()">Entrar al Panel</button>
                        </div>
                    </div>
                </div>
            `;
        }

        async function validarAdmin() {
            const zona_id = document.getElementById('admin-zona').value;
            const pass = document.getElementById('admin-pass').value;

            const { data, error } = await _supabase.from('zonas').select('*').eq('id', zona_id).single();
            if (error || !data) {
                alert('Error al validar la zona.');
                return;
            }

            if (data.password_admin === pass) {
                showAdminDashboard(zona_id, data.nombre_zona);
            } else {
                alert('Contraseña incorrecta.');
            }
        }

        // PANEL DE ADMINISTRADOR POR ZONA
        async function showAdminDashboard(zona_id, nombre_zona) {
            const container = document.getElementById('main-container');
            
            // Cargar iglesias de esta zona
            const { data: iglesias, error } = await _supabase.from('iglesias').select('*').eq('zona_id', zona_id);

            container.innerHTML = `
                <div class="card card-main p-4">
                    <div class="d-flex flex-column flex-md-row justify-content-between align-items-center mb-4 gap-3">
                        <div>
                            <h3 class="fw-bold text-success mb-0"><i class="bi bi-shield-lock-fill me-2"></i>Panel: ${nombre_zona}</h3>
                            <p class="text-muted mb-0">Gestión y reportes generales de la zona</p>
                        </div>
                        <div class="d-flex flex-wrap gap-2">
                            <button class="btn btn-outline-success btn-sm" onclick="exportarExcelGeneral(${zona_id}, '${nombre_zona}')"><i class="bi bi-file-earmark-excel me-1"></i> Excel General</button>
                            <button class="btn btn-outline-danger btn-sm" onclick="exportarPdfGeneral(${zona_id}, '${nombre_zona}')"><i class="bi bi-file-earmark-pdf me-1"></i> PDF General</button>
                            <button class="btn btn-custom-green btn-sm" onclick="exportarEdadesGeneral(${zona_id}, '${nombre_zona}')"><i class="bi bi-people me-1"></i> Edades Master Excel</button>
                            <button class="btn btn-custom-red btn-sm" onclick="exportarEdadesPdf(${zona_id}, '${nombre_zona}')"><i class="bi bi-file-pdf me-1"></i> Edades Master PDF</button>
                        </div>
                    </div>

                    <!-- Barra de búsqueda -->
                    <div class="input-group mb-4">
                        <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                        <input type="text" class="form-control" id="search-iglesia" placeholder="Buscar iglesia por nombre o pastor..." onkeyup="filtrarIglesias()">
                    </div>

                    <div id="lista-iglesias" class="row g-3">
                        ${iglesias && iglesias.length > 0 ? iglesias.map(igl => `
                            <div class="col-md-6 iglesia-item" data-nombre="${igl.nombre.toLowerCase()}${igl.pastor.toLowerCase()}">
                                <div class="card border p-3 shadow-sm h-100">
                                    <h5 class="fw-bold text-success">${igl.nombre}</h5>
                                    <p class="mb-1 text-muted small"><i class="bi bi-person me-1"></i> Pastor: ${igl.pastor}</p>
                                    <p class="mb-1 text-muted small"><i class="bi bi-telephone me-1"></i> ${igl.telefono}</p>
                                    <p class="mb-3 text-muted small"><i class="bi bi-calendar me-1"></i> Entrega: ${igl.fecha_entrega}</p>
                                    <button class="btn btn-custom-green btn-sm mt-auto" onclick="verDetallesIglesia(${igl.id}, ${zona_id}, '${nombre_zona}')">
                                        <i class="bi bi-eye me-1"></i> Ver Detalles y Gestionar
                                    </button>
                                </div>
                            </div>
                        `).join('') : '<p class="text-muted text-center">No hay iglesias registradas en esta zona.</p>'}
                    </div>
                </div>
            `;
        }

        function filtrarIglesias() {
            const filtro = document.getElementById('search-iglesia').value.toLowerCase();
            const items = document.querySelectorAll('.iglesia-item');
            items.forEach(item => {
                const texto = item.getAttribute('data-nombre');
                item.style.display = texto.includes(filtro) ? 'block' : 'none';
            });
        }

        // VER DETALLES DE IGLESIA (CON ZONA EXCLUSIVA DE EDICIÓN / ELIMINACIÓN ACOMODADA)
        async function verDetallesIglesia(iglesia_id, zona_id, nombre_zona) {
            const { data: igl } = await _supabase.from('iglesias').select('*').eq('id', iglesia_id).single();
            const { data: ninos } = await _supabase.from('ninos').select('*').eq('iglesia_id', iglesia_id);

            const container = document.getElementById('main-container');
            container.innerHTML = `
                <div class="card card-main p-4">
                    <button class="btn btn-secondary btn-sm mb-3 w-auto align-self-start" onclick="showAdminDashboard(${zona_id}, '${nombre_zona}')">
                        <i class="bi bi-arrow-left me-1"></i> Volver al Panel
                    </button>

                    <!-- Zona Exclusiva de Administración de Iglesia (Botones corregidos sin desbordarse) -->
                    <div class="admin-action-box">
                        <h5 class="fw-bold mb-2"><i class="bi bi-tools me-2"></i>Zona Exclusiva de Administración</h5>
                        <p class="small mb-3">Opciones protegidas para modificar o dar de baja este registro.</p>
                        <div class="admin-action-buttons">
                            <button class="btn btn-warning fw-semibold text-dark flex-grow-1" onclick="editarIglesia(${iglesia_id}, ${zona_id}, '${nombre_zona}')">
                                <i class="bi bi-pencil-square me-1"></i> Editar Datos
                            </button>
                            <button class="btn btn-danger fw-semibold flex-grow-1" onclick="eliminarIglesia(${iglesia_id}, ${zona_id}, '${nombre_zona}')">
                                <i class="bi bi-trash-fill me-1"></i> Eliminar Registro
                            </button>
                        </div>
                    </div>

                    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3">
                        <h3 class="fw-bold text-success">${igl.nombre}</h3>
                        <div class="d-flex gap-2">
                            <button class="btn btn-outline-success btn-sm" onclick="exportarExcelIglesia(${iglesia_id})"><i class="bi bi-file-earmark-excel me-1"></i> Excel</button>
                            <button class="btn btn-outline-danger btn-sm" onclick="exportarPdfIglesia(${iglesia_id})"><i class="bi bi-file-earmark-pdf me-1"></i> PDF</button>
                        </div>
                    </div>

                    <p class="mb-1"><i class="bi bi-person me-1"></i> <strong>Pastor:</strong> ${igl.pastor}</p>
                    <p class="mb-1"><i class="bi bi-geo-alt me-1"></i> <strong>Domicilio:</strong> ${igl.domicilio}</p>
                    <p class="mb-1"><i class="bi bi-telephone me-1"></i> <strong>Teléfono:</strong> ${igl.telefono}</p>
                    <p class="mb-1"><i class="bi bi-map me-1"></i> <strong>Municipio/Estado:</strong> ${igl.municipio}</p>
                    <p class="mb-3"><i class="bi bi-calendar me-1"></i> <strong>Fecha de Entrega:</strong> ${igl.fecha_entrega}</p>

                    <h5 class="fw-bold text-danger mt-4 mb-3">Listado de Niños</h5>
                    <div class="table-responsive">
                        <table class="table table-bordered table-striped text-center align-middle">
                            <thead class="table-dark">
                                <tr>
                                    <th>#</th>
                                    <th>Nombre</th>
                                    <th>Género</th>
                                    <th>Edad</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${ninos && ninos.length > 0 ? ninos.map((n, index) => `
                                    <tr>
                                        <td>${index + 1}</td>
                                        <td class="text-start">${n.nombre_nino}</td>
                                        <td>${n.genero === 'Niño' ? '👦 Niño' : '👧 Niña'}</td>
                                        <td>${n.edad} años</td>
                                    </tr>
                                `).join('') : '<tr><td colspan="4" class="text-muted">No hay niños registrados</td></tr>'}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        // FUNCIONES DE EDICIÓN Y ELIMINACIÓN DE IGLESIA
        async function eliminarIglesia(iglesia_id, zona_id, nombre_zona) {
            if (confirm('¿Estás seguro de eliminar esta iglesia y todos sus niños registrados? Esta acción no se puede deshacer.')) {
                await _supabase.from('ninos').delete().eq('iglesia_id', iglesia_id);
                await _supabase.from('iglesias').delete().eq('id', iglesia_id);
                alert('Iglesia eliminada correctamente.');
                showAdminDashboard(zona_id, nombre_zona);
            }
        }

        async function editarIglesia(iglesia_id, zona_id, nombre_zona) {
            const { data: igl } = await _supabase.from('iglesias').select('*').eq('id', iglesia_id).single();
            const container = document.getElementById('main-container');
            container.innerHTML = `
                <div class="row justify-content-center">
                    <div class="col-lg-8">
                        <div class="card card-main p-4">
                            <h3 class="fw-bold text-warning text-dark mb-3">Editar Iglesia</h3>
                            <form id="form-edit-iglesia">
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Nombre de la Iglesia:</label>
                                    <input type="text" class="form-control" id="edit-nombre" value="${igl.nombre}" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Pastor:</label>
                                    <input type="text" class="form-control" id="edit-pastor" value="${igl.pastor}" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Domicilio:</label>
                                    <input type="text" class="form-control" id="edit-domicilio" value="${igl.domicilio}" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Teléfono:</label>
                                    <input type="tel" class="form-control" id="edit-telefono" value="${igl.telefono}" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Municipio/Estado:</label>
                                    <input type="text" class="form-control" id="edit-municipio" value="${igl.municipio}" required>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label fw-semibold">Fecha de Entrega:</label>
                                    <input type="date" class="form-control" id="edit-fecha" value="${igl.fecha_entrega}" required>
                                </div>
                                <div class="d-flex gap-2">
                                    <button type="submit" class="btn btn-custom-green flex-grow-1">Guardar Cambios</button>
                                    <button type="button" class="btn btn-secondary" onclick="verDetallesIglesia(${iglesia_id}, ${zona_id}, '${nombre_zona}')">Cancelar</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('form-edit-iglesia').addEventListener('submit', async (e) => {
                e.preventDefault();
                const nombre = document.getElementById('edit-nombre').value;
                const pastor = document.getElementById('edit-pastor').value;
                const domicilio = document.getElementById('edit-domicilio').value;
                const telefono = document.getElementById('edit-telefono').value;
                const municipio = document.getElementById('edit-municipio').value;
                const fecha_entrega = document.getElementById('edit-fecha').value;

                const { error } = await _supabase.from('iglesias').update({
                    nombre, pastor, domicilio, telefono, municipio, fecha_entrega
                }).eq('id', iglesia_id);

                if (error) {
                    alert('Error al actualizar: ' + error.message);
                } else {
                    alert('Iglesia actualizada correctamente.');
                    verDetallesIglesia(iglesia_id, zona_id, nombre_zona);
                }
            });
        }

        // EXPORTAR EXCEL / PDF GENERAL Y EDADES (FORMATO SOLICITADO)
        async function exportarExcelGeneral(zona_id, nombre_zona) {
            const { data: iglesias } = await _supabase.from('iglesias').select('id').eq('zona_id', zona_id);
            if (!iglesias || iglesias.length === 0) { alert('No hay datos para exportar'); return; }
            const ids = iglesias.map(i => i.id);
            const { data: ninos } = await _supabase.from('ninos').select('*').in('iglesia_id', ids);

            let wb = XLSX.utils.book_new();
            let wsData = [["Nombre del Niño", "Género", "Edad"]];
            ninos.forEach(n => wsData.push([n.nombre_nino, n.genero, n.edad]));
            let ws = XLSX.utils.aoa_to_sheet(wsData);
            XLSX.utils.book_append_sheet(wb, ws, "General Zona");
            XLSX.writeFile(wb, `Reporte_General_${nombre_zona}.xlsx`);
        }

        async function exportarPdfGeneral(zona_id, nombre_zona) {
            alert('Generando PDF General de la zona...');
        }

        async function exportarEdadesGeneral(zona_id, nombre_zona) {
            const { data: iglesias } = await _supabase.from('iglesias').select('id').eq('zona_id', zona_id);
            if (!iglesias || iglesias.length === 0) { alert('No hay datos'); return; }
            const ids = iglesias.map(i => i.id);
            const { data: ninos } = await _supabase.from('ninos').select('*').in('iglesia_id', ids);

            // Separar por rangos y género
            let ninas_2_4 = ninos.filter(n => n.genero === 'Niña' && n.edad >= 2 && n.edad <= 4);
            let ninos_2_4 = ninos.filter(n => n.genero === 'Niño' && n.edad >= 2 && n.edad <= 4);
            let ninas_5_9 = ninos.filter(n => n.genero === 'Niña' && n.edad >= 5 && n.edad <= 9);
            let ninos_5_9 = ninos.filter(n => n.genero === 'Niño' && n.edad >= 5 && n.edad <= 9);
            let ninas_10_14 = ninos.filter(n => n.genero === 'Niña' && n.edad >= 10 && n.edad <= 14);
            let ninos_10_14 = ninos.filter(n => n.genero === 'Niño' && n.edad >= 10 && n.edad <= 14);

            let wb = XLSX.utils.book_new();
            let wsData = [
                ["NIÑAS", "", "NIÑOS"],
                ["--- 2-4 AÑOS ---", "", "--- 2-4 AÑOS ---"]
            ];

            let maxLen = Math.max(ninas_2_4.length, ninos_2_4.length, ninas_5_9.length, ninos_5_9.length, ninas_10_14.length, ninos_10_14.length, 1);
            
            let formatBloque = (titulo, ninasArr, ninosArr) => {
                wsData.push([titulo, "", ""]);
                let max = Math.max(ninasArr.length, ninosArr.length);
                for(let i=0; i<max; i++) {
                    wsData.push([
                        ninasArr[i] ? `${i+1}. ${ninasArr[i].nombre_nino}` : "",
                        "",
                        ninosArr[i] ? `${i+1}. ${ninosArr[i].nombre_nino}` : ""
                    ]);
                }
            };

            formatBloque("2 - 4 AÑOS", ninas_2_4, ninos_2_4);
            formatBloque("5 - 9 AÑOS", ninas_5_9, ninos_5_9);
            formatBloque("10 - 14 AÑOS", ninas_10_14, ninos_10_14);

            let ws = XLSX.utils.aoa_to_sheet(wsData);
            XLSX.utils.book_append_sheet(wb, ws, "Edades Master");
            XLSX.writeFile(wb, `Reporte_Edades_${nombre_zona}.xlsx`);
        }

        async function exportarEdadesPdf(zona_id, nombre_zona) {

            doc.text(`Listado por Edades - ${nombre_zona}`, 14, 20);
